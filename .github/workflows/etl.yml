name: WinScope ETL

# What the cron actually does: fetch new/live matches and upsert them into Turso.
# It commits NOTHING. model_data.csv is refreshed and committed by retrain.yml
# (weekly), which is also what retrains the model; refresh-dataset below is the
# by-hand version of that step.
#
# Actions minutes are unlimited (public repo), so the only budget that constrains
# the schedule is API-Football's 100 requests/day — and we stop at 90.
#
#   api-football      5 requests/pass (1 status + 1 live=all + 3 dates)  90/day CAP
#   football-data.org 2 requests/pass (15-day window, 10-day max slice)  no daily cap
#   thesportsdb      23 requests/pass (livescore + next/past x 11)       no daily cap
#
# WHY ONE LONG JOB, AND NOT ONE JOB PER TICK
# ------------------------------------------
# GitHub does not deliver `schedule` events reliably on a public repo. With a
# tick configured every 20 minutes, ~40 runs a day were due and 2-4 actually
# started — hours late (a 06:00 UTC cron landing at 10:35). A pass that never
# starts cannot refresh a live score, which is how a match ended up frozen
# mid-play on the dashboard for four days.
#
# So the schedule no longer carries the cadence: the JOB does. Each run loops
# internally, doing a pass every PASS_MINUTES for up to LOOP_MINUTES. The cron
# entries below are a WATCHDOG — they restart the loop after one finishes, or
# after a trigger was dropped. `concurrency` keeps exactly one loop alive, and a
# queued run starts the moment the running one exits, so cover stays continuous
# even when most triggers never arrive.
#
# TWO SPEEDS INSIDE THE LOOP, because only one provider is capped.
#   fast — every pass, on the UNCAPPED providers. Costs API-Football nothing.
#          football-data.org carries live scores for the big European leagues on
#          a 5-minute cache TTL, and TheSportsDB's livescore.php is one global
#          request that also reports a match clock.
#   full — adds API-Football, at most once an hour and only from FULL_FROM_HOUR
#          UTC on: 14 x 5 = 70 of the 90, leaving 20 for manual dispatch. The
#          window is what keeps it inside the cap — round the clock it would be
#          24 x 5 = 120 and would run dry by evening, which is exactly when the
#          SA PSL kicks off and API-Football is the only source that covers it
#          live. It is also the only cross-check on the other two.
#
# AFTER EVERY PASS: THE PREDICTION GUARD
# --------------------------------------
# New fixtures land in Turso here, but predictions are made by the web app,
# and only when someone loads the dashboard while the model server is awake
# (Render's free tier sleeps after 15 idle minutes and takes ~50s to wake — a
# page load in that window gets no predictions at all). A fixture that kicks
# off before that happens can never be scored. So each pass ends by waking the
# model server and calling the web app's /api/predict/backfill, which predicts
# whatever upcoming fixture has nothing on file. Needs two secrets:
#   WINSCOPE_WEB_URL       e.g. https://winscope.vercel.app  (no trailing slash)
#   WINSCOPE_BACKFILL_KEY  the same value as the Vercel env var of that name
# and optionally MODEL_SERVER_URL (the Render URL) to wake the model first.
# Without WINSCOPE_WEB_URL the step is skipped and the ETL behaves as before.

on:
  schedule:
    # Watchdog only — NOT the cadence (see above). Deliberately off the hour:
    # the top of the hour is when GitHub sheds the most scheduled events.
    - cron: '13 * * * *'
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: >
          live = fetch matches into Turso from every provider (no commit).
          live-uncapped = same, but skips API-Football so it spends none of the
          100/day budget.
          refresh-dataset = rescan unsorted/ + APIs + fold Turso results back in,
          then commit model_data.csv. Run this before a retrain.
        default: live
        type: choice
        options: [live, live-uncapped, refresh-dataset]
      minutes:
        description: >
          How long to keep looping, in minutes. 0 = a single pass and stop.
          Ignored by refresh-dataset.
        default: '170'
        type: string

concurrency:
  # Never let two loops spend the API budget at the same time. A trigger that
  # arrives while a loop is running waits and takes over when it ends — that
  # handover is what makes the cover continuous.
  group: winscope-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest

    # Below the 6h hard ceiling, and above LOOP_MINUTES plus setup, so a wedged
    # pass releases the concurrency group in good time instead of holding it.
    timeout-minutes: 200

    # Only the refresh-dataset path needs this: it commits model_data.csv and
    # pushes. Since 2023 the default GITHUB_TOKEN is read-only, so without this
    # that step builds, fetches, and then dies on the push with a 403.
    # The everyday `live` run commits nothing and does not need it.
    permissions:
      contents: write

    env:
      PASS_MINUTES: 20                       # a pass every 20 minutes...
      LOOP_MINUTES: ${{ inputs.minutes || '170' }}   # ...for just under 3 hours
      FULL_EVERY_MINUTES: 60                 # how often a pass may spend API-Football
      FULL_FROM_HOUR: 10                     # ...and not before this hour UTC (12:00 SAST)

    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: data/requirements.txt

      - run: pip install -r requirements.txt

      # Cached, not committed: API responses + the daily quota counter, kept
      # across runs without growing the repo. A cache miss is harmless — the
      # daily budget re-syncs from API-Football's own reported usage. Within a
      # loop the file simply stays on disk, so every pass shares one budget.
      - name: Restore API cache and quota counter
        uses: actions/cache@v6
        with:
          path: |
            data/output/cache
            data/output/.quota.json
          key: winscope-api-${{ github.run_id }}
          restore-keys: winscope-api-

      # Offline — needs no key and cannot spend a request. Runs first so a broken
      # parser is caught before we touch anyone's rate limit.
      - name: Tests (offline, cannot reach an API)
        run: python -m unittest discover -s tests -t .

      - name: Remaining API budget
        run: python pipeline.py --quota

      # ---- the everyday job: new + live matches into Turso, nothing committed
      #
      # One pass immediately, then another every PASS_MINUTES until LOOP_MINUTES
      # is up. A pass is never allowed to take the loop down with it: a provider
      # timing out or a Turso blip is logged and the next pass carries on.
      - name: Fetch matches into Turso
        if: inputs.mode != 'refresh-dataset'
        env:
          UNCAPPED:              ${{ inputs.mode == 'live-uncapped' && '1' || '0' }}
          API_SPORTS_KEY:        ${{ secrets.API_SPORTS_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          THESPORTSDB_KEY:       ${{ secrets.THESPORTSDB_KEY }}
          TURSO_FIXTURES_URL:    ${{ secrets.TURSO_FIXTURES_URL }}
          TURSO_FIXTURES_TOKEN:  ${{ secrets.TURSO_FIXTURES_TOKEN }}
          WINSCOPE_WEB_URL:      ${{ secrets.WINSCOPE_WEB_URL }}
          WINSCOPE_BACKFILL_KEY: ${{ secrets.WINSCOPE_BACKFILL_KEY }}
          MODEL_SERVER_URL:      ${{ secrets.MODEL_SERVER_URL }}
        run: |
          set -u
          deadline=$(( LOOP_MINUTES * 60 ))
          gap=$(( PASS_MINUTES * 60 ))
          next_full=0            # $SECONDS at which API-Football may be spent again
          pass=0

          # The prediction guard (see the header). Never fails the pass: an
          # asleep model or a cold Vercel function is retried 20 minutes later.
          backfill() {
            [ -n "${WINSCOPE_WEB_URL:-}" ] || return 0
            if [ -n "${MODEL_SERVER_URL:-}" ]; then
              # Wake Render first so the web call does not spend its budget waiting.
              curl -sS --max-time 90 -o /dev/null -w '  model server: HTTP %{http_code} in %{time_total}s\n' \
                "${MODEL_SERVER_URL%/}/health" || true
            fi
            curl -sS --max-time 70 -X POST \
              -H "x-winscope-key: ${WINSCOPE_BACKFILL_KEY:-}" \
              "${WINSCOPE_WEB_URL%/}/api/predict/backfill" \
              | python -c 'import json,sys; d=json.load(sys.stdin); print("  backfill:", d.get("message") or d.get("error")); [print("    - " + m) for m in d.get("still_missing", [])[:20]]' \
              || echo "  backfill: call failed — next pass retries"
          }
          while : ; do
            pass=$(( pass + 1 ))
            # The fast lane runs every pass; the full one is rationed by the
            # clock, not by which cron fired — the loop makes that unknowable.
            # `10#` forces base 10: `08` is not a valid octal number and would
            # otherwise abort the whole step.
            hour=$(( 10#$(date -u +%H) ))
            if [ "$UNCAPPED" = '1' ] || [ "$SECONDS" -lt "$next_full" ] \
               || [ "$hour" -lt "$FULL_FROM_HOUR" ]; then
              providers='football-data,thesportsdb'
            else
              providers='all'
              next_full=$(( SECONDS + FULL_EVERY_MINUTES * 60 ))
            fi
            echo "::group::pass $pass · +$(( SECONDS / 60 ))m · providers: $providers"
            timeout 600 python pipeline.py --live --providers "$providers" \
              || echo "!! pass $pass failed (exit $?) — continuing"
            backfill
            echo "::endgroup::"
            # Stop when the next pass would land past the deadline; the queued
            # run takes over from here.
            [ $(( SECONDS + gap )) -ge "$deadline" ] && break
            sleep "$gap"
          done
          echo "ran $pass pass(es) over $(( SECONDS / 60 ))m"
          python pipeline.py --quota

      # ---- manual only: rebuild the training set before a retrain
      - name: Refresh the training dataset
        if: inputs.mode == 'refresh-dataset'
        run: |
          python pipeline.py --with-api --openfootball
          python pipeline.py --from-turso     # fold in results collected since
        env:
          API_SPORTS_KEY:        ${{ secrets.API_SPORTS_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          THESPORTSDB_KEY:       ${{ secrets.THESPORTSDB_KEY }}
          TURSO_FIXTURES_URL:    ${{ secrets.TURSO_FIXTURES_URL }}
          TURSO_FIXTURES_TOKEN:  ${{ secrets.TURSO_FIXTURES_TOKEN }}

      - name: Commit refreshed dataset
        if: inputs.mode == 'refresh-dataset'
        run: |
          git config user.name  "winscope-bot"
          git config user.email "bot@winscope.local"
          git add output/model_data.csv output/.manifest.json output/conflicts.csv || true
          git commit -m "chore: refresh training dataset [skip ci]" || echo "no changes"
          git push || echo "nothing to push"
